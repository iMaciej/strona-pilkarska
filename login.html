<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie admina - KS Lechia Grodzisk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>KS Lechia Grodzisk</h1>
    <p>Logowanie do panelu administracyjnego</p>
</header>

<main>
    <section>
        <h2>Zaloguj się</h2>
        <form id="formularz-logowania">
            <label for="haslo">Hasło</label>
            <input type="password" id="haslo" name="haslo" required>
            <button type="submit">Zaloguj</button>
        </form>
        <p id="blad-logowania" class="ukryty" style="color: red;"></p>
    </section>
</main>

<footer>
    <p>&copy; 2026 KS Lechia Grodzisk</p>
</footer>

<script src="script.js"></script>
</body>
</html>
